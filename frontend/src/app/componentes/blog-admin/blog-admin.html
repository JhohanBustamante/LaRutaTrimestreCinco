<app-header></app-header>
<main class="container mt-5">

    <div class="row mb-4">
        <div class="col-md-6">
            <label for="fechaFiltro" class="form-label">Filtrar por fecha de creación:</label>
            <input type="date" id="fechaFiltro" class="form-control">
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle text-center">
            <thead class="table-danger">
                <tr>
                    <th>ID</th>
                    <th>Nombre de la comunidad</th>
                    <th>Descripción</th>
                    <th>Fecha de creación</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaComunidades">
                <tr *ngFor="let item of comunidades">
                    <td>{{item.id}}</td>
                    <td>{{item.nombre}}</td>
                    <td>{{item.descripcion}}</td>
                    <td>{{item.fecha}}</td>
                    <td>
                        <button class="btn btn-sm btn-primary"><i class="bi bi-eye"></i></button>
                        <button class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const fechaFiltro = document.getElementById("fechaFiltro");
    const tablaComunidades = document.getElementById("tablaComunidades").getElementsByTagName("tr");

    fechaFiltro.addEventListener("change", function () {
        const fechaSeleccionada = this.value;
        for (let fila of tablaComunidades) {
            const fecha = fila.cells[3].textContent;
            if (fechaSeleccionada === "" || fecha === fechaSeleccionada) {
                fila.style.display = "";
            } else {
                fila.style.display = "none";
            }
        }
    });

    document.getElementById("year").textContent = new Date().getFullYear();
</script>
<app-footer></app-footer>
