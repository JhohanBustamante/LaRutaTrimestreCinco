<div class="container">
    <div class="row">
        <table class="table table-dark">
            <thead>
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Apellido</th>
                    <th scope="col">Correo</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of datos; trackBy: trackById">
                    <td>{{ item.nombre }}</td>
                    <td>{{ item.apellido }}</td>
                    <td>{{ item.correo }}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
