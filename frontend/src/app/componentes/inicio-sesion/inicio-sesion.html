<main>
  <div class="container">
    <div class="row">
      <div class="col-12 col-md-6">
        <form class="was-validated">
          <div class="mb-3">
            <label for="apodo" class="form-label">Usuario</label>
            <input type="text" id="apodo" class="form-control" [(ngModel)]="apodo" name="apodo">
          </div>
          <div class="mb-3">
            <label for="contrasena" class="form-label">Password</label>
            <input type="password" id="contrasena" class="form-control" [(ngModel)]="contrasena" name="contrasena">
            <div id="passwordHelpBlock" class="form-text">
              Tu contraseña debe tener entre 10 y 20 caracteres.
            </div>
          </div>
          <div class="mb-3">
            <button class="btn btn-primary" type="button" (click)="iniciar()">Iniciar</button>
          </div>
          <div class="mb-3">
            <a class="btn btn-primary" type="button" routerLink="/registro">Ir a registro</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>

<div class="container">
    <div class="row g-4 align-items-center justify-content-center">
      
      <div class="col-12 col-lg-6 text-center">
        <img src="/frontend/public/imagenes/logos/New_Logo_Modo_Claro.png" alt="Logo La Ruta" class="img-fluid" id="imagenInicio">
      </div>

      <div class="col-12 col-lg-5">
        <div class="card py-4 px-3 px-md-5 color-fondo shadow">
          <form id="IS-FV-datos" class="row g-3 justify-content-center">
            
            <div class="col-12 text-center">
              <h1 id="textoInicio" class="mb-3">Iniciar sesión</h1>
            </div>
            
            <div class="col-12 col-sm-9 col-md-10">
              <input type="text" id="IS-FV-usuario" class="form-control" 
                     placeholder="Ingresa tu apodo" required>
            </div>

            <div class="col-12 col-sm-9 col-md-10">
              <input type="password" id="IS-FV-contrasena" class="form-control" 
                     placeholder="Contraseña" required>
            </div>

            <div class="col-12 text-center mt-3" >
              <button type="button" class="btn btn-primary px-5 py-2" onclick="confirmacion()">
                Iniciar Sesión
              </button>
            </div>

            <div class="col-12 text-center mt-3"id=link>
              <a href="#" class="recordar-link">¿Olvidaste tu cuenta?</a>
            </div>

            <div class="col-12 text-center mt-3"id=link>
              <a href="../html/registro.html" class="nuevoUsuario">Crea una cuenta</a>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
