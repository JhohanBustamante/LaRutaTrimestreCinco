<main>
  <div class="container">
    <div class="row">
      <div class="col-12 col-md-6">
        <form class="was-validated" style="width: 1;">
          <div class="mb-3">
            <label for="Usuario" class="form-label">Usuario o correo</label>
            <input type="text" id="Usuario" class="form-control" aria-describedby="passwordHelpBlock"
              [(ngModel)]="correo">
          </div>
          <div class="mb-3">
            <label for="inputPassword5" class="form-label">Password</label>
            <input type="password" id="inputPassword5" class="form-control" aria-describedby="passwordHelpBlock"
              [(ngModel)]="contrasena">
            <div id="passwordHelpBlock" class="form-text">
              Tu contraseña debe tener entre 10 y 20 caracteres.
            </div>
          </div>
          <div class="mb-3">
            <button class="btn btn-primary" type="button">Iniciar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
